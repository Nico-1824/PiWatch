<!DOCTYPE html>
<html>
    <head>
        <title>PiWatch</title>
        <link rel="stylesheet" href="styles.css"/>
        <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
        <script src="client.js" defer></script>
        <meta charset="UTF-8">
    </head>
    <body>
        <div class="bg-grid"></div>

        <header>
            <div class="logo-area">
                <div class="logo-icon">📡</div>
                <div>
                    <h1>PiWatch</h1>
                    <p class="tagline">SDSU Area Monitoring System</p>
                </div>
            </div>
            <div class="status-bar">
                <span class="status-dot"></span>
                <span class="status-text">LIVE</span>
            </div>

            <div class="scroll-view">
                <!-- Cards injected by JS -->
            </div>
        </header>

        <main>
            <div class="chat-wrapper">
                <div class="chat-header">
                    <span>💬 Campus Chat</span>
                    <span class="chat-live-dot"></span>
                </div>
                <div class="chat-room">
                    <div class="chat-box"></div>
                    <form class="chat-input">
                        <input type="text" placeholder="Message the campus..."/>
                        <button type="submit" class="send-btn">↑</button>
                    </form>
                </div>
            </div>
            <button id="summary-btn">✦ View Chat Summary</button>
        </main>

        <div id="summary-modal" class="modal-overlay hidden">
            <div class="modal-box">
                <div class="modal-header">
                    <h2>Chat Summary</h2>
                    <button id="modal-close">&times;</button>
                </div>
                <div class="modal-body">
                    <p id="summary-text">Loading...</p>
                </div>
            </div>
        </div>
    </body>
</html>
